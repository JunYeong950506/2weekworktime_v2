[project]
name = "cafe-ocr-worker"
version = "0.1.0"
description = "Cafe 701 number board OCR worker"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0",
  "pillow>=10.0.0",
  "playwright>=1.45.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pytesseract>=0.3.10",
  "rapidocr-onnxruntime>=1.3.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
cafe-ocr-worker = "cafe_ocr_worker.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cafe_ocr_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
